name: Live Kalyan & Rajdhani Auto-Sync

on:
  workflow_dispatch:

jobs:
  purge-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wipe Dummy Data & Push Fresh Real Data
        run: |
          python3 - << 'EOF'
          import urllib.request, json, datetime

          FIREBASE_URL = "https://smart-otc-cloud-default-rtdb.firebaseio.com".rstrip('/')

          # 1. 100% Clean Real Data Structure
          real_clean_data = {
              "kalyan": [
                  {
                      "week": "02/11/2026",
                      "days": [
                          {"open": "347", "jodi": "41", "close": "678"}, # Mon
                          {"open": "467", "jodi": "17", "close": "278"}, # Tue
                          {"open": "124", "jodi": "74", "close": "257"}, # Wed
                          {"open": "278", "jodi": "24", "close": "257"}, # Thu
                          None, # Fri (Holiday)
                          None  # Sat (Holiday)
                      ]
                  }
              ],
              "rajdhani": [],
              "rates": {"single": "95", "jodi": "950", "sp": "1400", "dp": "2800"},
              "updatedAt": datetime.datetime.utcnow().isoformat()
          }

          # 2. Firebase par PUT request bhej kar purana sab kuch replace kar dein
          put_req = urllib.request.Request(
              f"{FIREBASE_URL}/otc_pro_v51.json",
              data=json.dumps(real_clean_data).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
              method='PUT'
          )
          urllib.request.urlopen(put_req)
          print("Firebase successfully purged and updated with 100% Real Data!")
          EOF
