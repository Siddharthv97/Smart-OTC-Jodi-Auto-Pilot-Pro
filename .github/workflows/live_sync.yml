name: Live Scraper & Dual-Node Master Sync

on:
  schedule:
    - cron: '35,50 8 * * 1-6'
    - cron: '52 10 * * 1-6'
    - cron: '7 11 * * 1-6'
    - cron: '52 12 * * 1-6'
    - cron: '7 13 * * 1-6'
    - cron: '12,27 16 * * 1-6'
    - cron: '42,57 18 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Cloudscraper & BeautifulSoup4
        run: pip install cloudscraper beautifulsoup4 lxml

      - name: Run Standalone Python Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scraper.py

      - name: Commit & Push live_feed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_feed.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-sync live_feed.json with dates & charts [skip ci]"
            git pull --rebase origin main
            git push
          fi
