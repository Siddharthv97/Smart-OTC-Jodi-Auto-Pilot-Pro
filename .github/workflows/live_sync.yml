name: Live 4-Market Unified Scraper & Dual-Node Sync (v6.3)

on:
  schedule:
    - cron: '30 14,18,22 * * 1-6'
  workflow_dispatch:

jobs:
  sync-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Strict Scrape 4 Markets & Update Unified Firebase Nodes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'EOF'
          import urllib.request, re, json, datetime, ssl, os

          FIREBASE_URL = "https://smart-otc-cloud-default-rtdb.firebaseio.com".rstrip('/')
          SOURCES = ["https://dpboss.services/", "https://spboss.blog/", "https://sattamatka.sale/"]
          BANNED_FAKE = {"246-22-570", "137-19-450", "358-64-266", "147-29-450", "278-24-257", "158-46-367"}

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          def fetch_clean_text(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
                  with urllib.request.urlopen(req, context=ctx, timeout=12) as resp:
                      html = resp.read().decode('utf-8', errors='ignore')
                      html = re.sub(r'<script[\s\S]*?</script>', ' ', html, flags=re.I)
                      html = re.sub(r'<style[\s\S]*?</style>', ' ', html, flags=re.I)
                      html = re.sub(r'<[^>]+>', ' ', html)
                      return re.sub(r'\s+', ' ', html)
              except Exception:
                  return ""

          def parse_strict_market(text, market_name):
              escaped = re.escape(market_name).replace(r'\ ', r'\s+')
              pattern = rf"(?<![A-Z0-9]){escaped}(?!\s*(?:MORNING|NIGHT|DAY|STARLINE|GOLD|BAZAR|PRO|JACKPOT))[^0-9\*]{{1,90}}?([0-9\*]{{3}})\s*-\s*([0-9\*]{{1,2}})(?:\s*-?\s*([0-9\*]{{3}}))?"
              m = re.search(pattern, text, re.IGNORECASE)
              if not m:
                  return None
              op, jd, cl = m.group(1).strip(), m.group(2).strip(), (m.group(3) or "***").strip()
              res_str = f"{op}-{jd}-{cl}"
              if res_str in BANNED_FAKE:
                  return None
              return res_str

          scraped = {}
          key_map = {
              "MAIN BAZAR": "mainBazar",
              "TIME BAZAR": "timeBazar",
              "KALYAN": "kalyan",
              "RAJDHANI NIGHT": "rajdhani"
          }

          for src in SOURCES:
              text = fetch_clean_text(src)
              if not text:
                  continue
              for m_label, k_name in key_map.items():
                  if k_name not in scraped:
                      res = parse_strict_market(text, m_label)
                      if res:
                          scraped[k_name] = res
                          print(f"[Matched] {m_label} -> {res} (from {src})")
              if len(scraped) == 4:
                  break

          # Load existing master state
          try:
              req = urllib.request.urlopen(f"{FIREBASE_URL}/otc_pro_v62_master.json", context=ctx)
              state = json.loads(req.read().decode('utf-8')) or {}
          except Exception:
              state = {}

          feeders = state.get("feeders", {})
          for k in ["mainBazar", "timeBazar", "kalyan", "rajdhani"]:
              if k in scraped:
                  feeders[k] = scraped[k]
              elif feeders.get(k) in BANNED_FAKE:
                  feeders[k] = "SET-REAL"

          ist_now = datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)
          weekday = ist_now.weekday() # 0=Mon .. 5=Sat
          monday_date = ist_now - datetime.timedelta(days=weekday)
          current_week_str = monday_date.strftime("%d/%m/%Y")

          # Auto-update Panel Chart for Kalyan and Rajdhani if complete result available
          charts = state.get("charts", {"kalyan": [], "rajdhani": []})
          if weekday < 6:
              for m_key in ["kalyan", "rajdhani"]:
                  if m_key in scraped:
                      parts = scraped[m_key].split("-")
                      if len(parts) == 3 and "*" not in parts[0] and "*" not in parts[1] and len(parts[1]) == 2:
                          m_rows = charts.get(m_key, [])
                          target_row = next((r for r in m_rows if r.get("week") == current_week_str), None)
                          if not target_row:
                              target_row = {"week": current_week_str, "days": [None]*6}
                              m_rows.append(target_row)
                          target_row["days"][weekday] = {"open": parts[0], "jodi": parts[1], "close": parts[2]}
                          charts[m_key] = m_rows

          state["feeders"] = feeders
          state["charts"] = charts
          state["updatedAt"] = ist_now.strftime("%Y-%m-%d %H:%M:%S IST")

          payload = json.dumps(state).encode('utf-8')
          for node in ["otc_pro_v62_master.json", "otc_pro_v61_real.json"]:
              put_req = urllib.request.Request(
                  f"{FIREBASE_URL}/{node}",
                  data=payload,
                  headers={'Content-Type': 'application/json'},
                  method='PUT'
              )
              urllib.request.urlopen(put_req, context=ctx)

          # Send Telegram Notification if configured in GitHub Secrets
          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          if bot_token and chat_id:
              msg = (
                  f"⚡ *Smart OTC Pro v6.3 Cloud Sync*\n"
                  f"🕒 Time: {state['updatedAt']}\n"
                  f"👑 Kalyan: `{feeders.get('kalyan', 'N/A')}`\n"
                  f"🌙 Rajdhani: `{feeders.get('rajdhani', 'N/A')}`\n"
                  f"⏱️ Time Bazar: `{feeders.get('timeBazar', 'N/A')}`\n"
                  f"🏛️ Main Bazar: `{feeders.get('mainBazar', 'N/A')}`"
              )
              tg_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
              tg_data = json.dumps({"chat_id": chat_id, "text": msg, "parse_mode": "Markdown"}).encode('utf-8')
              try:
                  urllib.request.urlopen(urllib.request.Request(tg_url, data=tg_data, headers={'Content-Type': 'application/json'}))
              except Exception as te:
                  print(f"[Warn] Telegram push skipped: {te}")

          print("Successfully synced unified v6.3 nodes at:", state["updatedAt"])
          EOF
