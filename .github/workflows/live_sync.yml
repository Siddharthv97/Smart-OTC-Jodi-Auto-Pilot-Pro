name: Live Scraper & Dual-Node Master Sync (v6.5)

on:
  schedule:
    - cron: '30 14,18,22 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Cloudscraper & BeautifulSoup4
        run: pip install cloudscraper beautifulsoup4 lxml

      - name: Run Master Scraper & Update Firebase + live_feed.json
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'EOF'
          import cloudscraper
          from bs4 import BeautifulSoup
          import re, json, datetime, urllib.request, ssl, os

          TARGET_URL = "https://sattamatka.email/"
          FIREBASE_URL = "https://smart-otc-cloud-default-rtdb.firebaseio.com".rstrip('/')

          scraper = cloudscraper.create_scraper(
              browser={'browser': 'chrome', 'platform': 'windows', 'mobile': False}
          )
          resp = scraper.get(TARGET_URL, timeout=20)
          soup = BeautifulSoup(resp.text, "lxml")

          chart_links = {}
          for a in soup.find_all("a", href=True):
              href = a["href"]
              txt = " ".join(a.get_text(" ", strip=True).split()).upper()
              parent_txt = " ".join(a.parent.get_text(" ", strip=True).split()).upper() if a.parent else ""
              if txt == "PANEL" or "PANEL-CHART" in href.upper() or "PANEL_CHART" in href.upper():
                  full_url = href if href.startswith("http") else TARGET_URL.rstrip("/") + "/" + href.lstrip("/")
                  for m in ["MAIN BAZAR", "TIME BAZAR", "KALYAN", "RAJDHANI NIGHT"]:
                      if re.search(rf"(?<![A-Z]){m}(?!\s*(?:MORNING|NIGHT|DAY|STARLINE))", parent_txt + " " + full_url.upper().replace("-", " ")):
                          if m not in chart_links:
                              chart_links[m] = full_url

          for tag in soup(["script", "style", "noscript"]):
              tag.decompose()

          full_page_text = " ".join(soup.get_text(" ", strip=True).split())

          def parse_first_live_slot(page_text, market_name):
              escaped = re.escape(market_name).replace(r"\ ", r"\s+")
              pattern = rf"(?<![A-Z0-9]){escaped}(?!\s*(?:MORNING|NIGHT|DAY|STARLINE|GOLD|BAZAR|JACKPOT))\s+Jodi\s+(.*?)\s+Panel"
              matches = list(re.finditer(pattern, page_text, re.IGNORECASE))
              if matches:
                  first_slot = matches[0].group(1).strip()
                  if len(first_slot) <= 45:
                      return first_slot
              return None

          DIGIT_SLOT_RE = re.compile(r'([0-9]{3})\s*-\s*([0-9\*]{1,2})(?:\s*-\s*([0-9\*]{3}))?')

          def is_valid_matka_record(o1, o2, o3, jodi, c1, c2, c3):
              m_val = lambda d: 10 if d == '0' else int(d)
              if not (m_val(o1) <= m_val(o2) <= m_val(o3)): return False
              if not (m_val(c1) <= m_val(c2) <= m_val(c3)): return False
              return ((int(o1)+int(o2)+int(o3)) % 10 == int(jodi[0])) and ((int(c1)+int(c2)+int(c3)) % 10 == int(jodi[1]))

          TABLE_CELL_RE = re.compile(r'(?<![0-9])([0-9])\s*([0-9])\s*([0-9])\s*[\-\s]+\s*([0-9]{2})\s*[\-\s]+\s*([0-9])\s*([0-9])\s*([0-9])(?![0-9])')

          def fetch_latest_from_panel_chart(url):
              if not url: return None, []
              try:
                  c_resp = scraper.get(url, timeout=15)
                  c_soup = BeautifulSoup(c_resp.text, "lxml")
                  valid_records = []
                  for tbl in c_soup.find_all("table"):
                      tbl_text = " ".join(tbl.get_text(" ", strip=True).split())
                      tbl_text = re.sub(r'\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\b', ' DATE ', tbl_text)
                      for m in TABLE_CELL_RE.finditer(tbl_text):
                          o1, o2, o3, jd, c1, c2, c3 = m.groups()
                          if is_valid_matka_record(o1, o2, o3, jd, c1, c2, c3):
                              valid_records.append({ "open": f"{o1}{o2}{o3}", "jodi": jd, "close": f"{c1}{c2}{c3}" })
                  if valid_records:
                      latest_str = f"{valid_records[-1]['open']}-{valid_records[-1]['jodi']}-{valid_records[-1]['close']}"
                      return latest_str, valid_records
              except Exception:
                  pass
              return None, []

          MARKETS = ["MAIN BAZAR", "TIME BAZAR", "KALYAN", "RAJDHANI NIGHT"]
          key_map = { "MAIN BAZAR": "mainBazar", "TIME BAZAR": "timeBazar", "KALYAN": "kalyan", "RAJDHANI NIGHT": "rajdhani" }

          final_results = {}
          chart_snapshots = { "kalyan": [], "rajdhani": [] }

          for m_name in MARKETS:
              live_slot = parse_first_live_slot(full_page_text, m_name)
              p_url = chart_links.get(m_name)
              locked_val = None
              all_recs = []

              if live_slot:
                  dm = DIGIT_SLOT_RE.search(live_slot)
                  if dm:
                      op, jd, cl = dm.group(1), dm.group(2), dm.group(3) or "***"
                      if len(jd) == 1: jd = f"{jd}*"
                      locked_val = f"{op}-{jd}-{cl}"

              if not locked_val and p_url:
                  chart_val, valid_recs = fetch_latest_from_panel_chart(p_url)
                  if chart_val:
                      locked_val = chart_val
                      all_recs = valid_recs

              final_results[key_map[m_name]] = locked_val or "WAITING-LIVE"

              # Pack into Mon-Sat weeks for Tab 3 chart if available
              if all_recs and m_name in ["KALYAN", "RAJDHANI NIGHT"]:
                  m_key = "kalyan" if m_name == "KALYAN" else "rajdhani"
                  chunked_weeks = []
                  for i in range(0, len(all_recs), 6):
                      days_chunk = [None] * 6
                      sub = all_recs[i:i+6]
                      for d_idx, item in enumerate(sub):
                          days_chunk[d_idx] = item
                      chunked_weeks.append({ "week": f"Auto-{i//6 + 1}", "days": days_chunk })
                  chart_snapshots[m_key] = chunked_weeks[-5:] # Keep last 5 weeks

          # Load Firebase State
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          try:
              req = urllib.request.urlopen(f"{FIREBASE_URL}/otc_pro_v62_master.json", context=ctx)
              state = json.loads(req.read().decode('utf-8')) or {}
          except Exception:
              state = {}

          state["feeders"] = final_results
          if chart_snapshots["kalyan"]: state["charts"] = chart_snapshots

          ist_now = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=5, minutes=30)
          state["updatedAt"] = ist_now.strftime("%Y-%m-%d %H:%M:%S IST")

          with open("live_feed.json", "w", encoding="utf-8") as f:
              json.dump(state, f, indent=2)

          payload = json.dumps(state).encode('utf-8')
          for node in ["otc_pro_v62_master.json", "otc_pro_v61_real.json", "otc_pro_v51.json"]:
              put_req = urllib.request.Request(
                  f"{FIREBASE_URL}/{node}",
                  data=payload,
                  headers={'Content-Type': 'application/json'},
                  method='PUT'
              )
              urllib.request.urlopen(put_req, context=ctx)
          EOF

      - name: Commit & Push live_feed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_feed.json
          git diff --staged --quiet || git commit -m "Auto-sync live_feed.json [skip ci]"
          git push
