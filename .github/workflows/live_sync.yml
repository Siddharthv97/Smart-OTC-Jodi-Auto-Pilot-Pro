name: Live Scraper (sattamatka.email DOM-Lock Test)

on:
  schedule:
    - cron: '30 14,18,22 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-sattamatka-email:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudscraper & BeautifulSoup4
        run: pip install cloudscraper beautifulsoup4 lxml

      - name: Scrape sattamatka.email with DOM Isolation & Update Firebase
        run: |
          python3 - << 'EOF'
          import cloudscraper
          from bs4 import BeautifulSoup
          import re, json, datetime, urllib.request, ssl

          TARGET_URL = "https://sattamatka.email/"
          FIREBASE_URL = "https://smart-otc-cloud-default-rtdb.firebaseio.com".rstrip('/')
          MARKETS = ["MAIN BAZAR", "TIME BAZAR", "KALYAN", "RAJDHANI NIGHT"]

          # Strict pattern that accepts EITHER real digits OR waiting stars (***-**-***)
          # so it never skips a waiting market to grab the next market's number
          RESULT_REGEX = re.compile(
              r'(?<![0-9\*])([0-9]{3}|\*{3})\s*-\s*([0-9]{1,2}|\*{1,2})(?:\s*-\s*([0-9]{3}|\*{3}))?(?![0-9\*])'
          )

          print(f"=== [1] FETCHING {TARGET_URL} ===")
          scraper = cloudscraper.create_scraper(
              browser={'browser': 'chrome', 'platform': 'windows', 'mobile': False}
          )
          resp = scraper.get(TARGET_URL, timeout=20)
          print(f"HTTP Status: {resp.status_code} | HTML Length: {len(resp.text)} chars")

          soup = BeautifulSoup(resp.text, "lxml")
          for tag in soup(["script", "style", "noscript"]):
              tag.decompose()

          def find_isolated_market_result(soup_obj, market_name):
              target_upper = market_name.strip().upper()
              candidates = []

              # Find any HTML element whose direct/stripped text is EXACTLY the market name
              for el in soup_obj.find_all(["h1", "h2", "h3", "h4", "h5", "h6", "span", "b", "strong", "div", "p", "td"]):
                  el_text = " ".join(el.get_text(" ", strip=True).split()).upper()
                  if el_text == target_upper:
                      # Walk up maximum 2 parent levels to get ONLY this market's box
                      box = el.parent
                      if box:
                          box_text = " ".join(box.get_text(" ", strip=True).split())
                          # If immediate parent only has the title, check 1 level higher
                          if not RESULT_REGEX.search(box_text) and box.parent:
                              box = box.parent
                              box_text = " ".join(box.get_text(" ", strip=True).split())

                          # Safety cut: Only inspect the text starting from the market name up to 120 chars
                          idx = box_text.upper().find(target_upper)
                          if idx != -1:
                              snippet = box_text[idx:idx + len(target_upper) + 120]
                              m = RESULT_REGEX.search(snippet)
                              if m:
                                  op = m.group(1)
                                  jd = m.group(2)
                                  cl = m.group(3) if m.group(3) else "***"
                                  res_str = f"{op}-{jd}-{cl}"
                                  candidates.append((res_str, snippet))

              return candidates

          print("\n=== [2] MULTIMETER DOM PROBE RESULTS ===")
          scraped_clean = {}
          key_map = {
              "MAIN BAZAR": "mainBazar",
              "TIME BAZAR": "timeBazar",
              "KALYAN": "kalyan",
              "RAJDHANI NIGHT": "rajdhani"
          }

          for m_name in MARKETS:
              matches = find_isolated_market_result(soup, m_name)
              print(f"\n--- Market: {m_name} (Found {len(matches)} DOM box matches) ---")
              chosen = None
              for idx, (res_str, raw_snip) in enumerate(matches):
                  print(f"  Match #{idx+1}: [{res_str}]  <-- Raw Box: {raw_snip}")
                  # Prefer a match that has actual digits over ***-**-*** if multiple boxes exist
                  if not chosen:
                      chosen = res_str
                  elif "*" in chosen and not res_str.startswith("***"):
                      chosen = res_str

              if chosen:
                  print(f"  ==> LOCKED RESULT FOR {m_name}: {chosen}")
                  scraped_clean[key_map[m_name]] = chosen
              else:
                  print(f"  ==> WARNING: No isolated box found for {m_name}")

          # [3] Update Firebase ONLY with verified results from sattamatka.email
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          try:
              req = urllib.request.urlopen(f"{FIREBASE_URL}/otc_pro_v62_master.json", context=ctx)
              state = json.loads(req.read().decode('utf-8')) or {}
          except Exception:
              state = {}

          feeders = state.get("feeders", {})
          for k_key, val in scraped_clean.items():
              # Update Firebase directly with the exact result on sattamatka.email
              feeders[k_key] = val

          ist_now = datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)
          state["feeders"] = feeders
          state["updatedAt"] = ist_now.strftime("%Y-%m-%d %H:%M:%S IST")

          payload = json.dumps(state).encode('utf-8')
          for node in ["otc_pro_v62_master.json", "otc_pro_v61_real.json", "otc_pro_v51.json"]:
              put_req = urllib.request.Request(
                  f"{FIREBASE_URL}/{node}",
                  data=payload,
                  headers={'Content-Type': 'application/json'},
                  method='PUT'
              )
              urllib.request.urlopen(put_req, context=ctx)

          print("\n=== [3] FIREBASE SYNC COMPLETE ===")
          print(json.dumps(feeders, indent=2))
          EOF
