name: Live Kalyan & Rajdhani Auto-Sync

on:
  schedule:
    - cron: '30 11,13,16,18 * * 1-6'
  workflow_dispatch:

jobs:
  sync-matka-results:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Holiday Data & Sync Firebase
        run: |
          python3 - << 'EOF'
          import urllib.request, json, datetime

          FIREBASE_URL = "https://smart-otc-cloud-default-rtdb.firebaseio.com".rstrip('/')

          # Pure Firebase Root Data ko check karein
          req = urllib.request.urlopen(f"{FIREBASE_URL}/.json")
          root_data = json.loads(req.read().decode('utf-8')) or {}

          def clean_kalyan_week(node):
              if isinstance(node, dict):
                  if "kalyan" in node and isinstance(node["kalyan"], list) and len(node["kalyan"]) > 0:
                      last_wk = node["kalyan"][-1]
                      days_key = "days" if "days" in last_wk else ("d" if "d" in last_wk else None)
                      if days_key and len(last_wk[days_key]) >= 5:
                          # Sirf Mon to Thu (first 4 days) rakhein, Fri & Sat dummy hata dein
                          last_wk[days_key] = last_wk[days_key][:4]
                  for k, v in node.items():
                      clean_kalyan_week(v)

          clean_kalyan_week(root_data)

          put_req = urllib.request.Request(
              f"{FIREBASE_URL}/.json",
              data=json.dumps(root_data).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
              method='PUT'
          )
          urllib.request.urlopen(put_req)
          print("Successfully removed Fri & Sat dummy data from Firebase!")
          EOF
