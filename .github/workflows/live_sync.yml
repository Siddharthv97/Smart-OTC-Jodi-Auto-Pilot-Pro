name: Live Scraper & Dual-Node Master Sync

on:
  schedule:
    - cron: '30 14,18,22 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Cloudscraper & BeautifulSoup4
        run: pip install cloudscraper beautifulsoup4 lxml

      - name: Run Master Scraper & Update Firebase + live_feed.json
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'EOF'
          import cloudscraper
          from bs4 import BeautifulSoup
          import re, json, datetime, urllib.request, ssl, os

          TARGET_URL = "https://sattamatka.email/"
          FIREBASE_URL = "https://smart-otc-cloud-default-rtdb.firebaseio.com".rstrip('/')

          scraper = cloudscraper.create_scraper(
              browser={'browser': 'chrome', 'platform': 'windows', 'mobile': False}
          )
          resp = scraper.get(TARGET_URL, timeout=20)
          soup = BeautifulSoup(resp.text, "lxml")

          chart_links = {}
          for a in soup.find_all("a", href=True):
              href = a["href"]
              txt = " ".join(a.get_text(" ", strip=True).split()).upper()
              parent_txt = " ".join(a.parent.get_text(" ", strip=True).split()).upper() if a.parent else ""
              if "PANEL" in txt or "CHART" in href.upper():
                  full_url = href if href.startswith("http") else TARGET_URL.rstrip("/") + "/" + href.lstrip("/")
                  for m in ["MAIN BAZAR", "TIME BAZAR", "KALYAN", "RAJDHANI NIGHT"]:
                      if re.search(rf"(?<![A-Z]){m}(?!\s*(?:MORNING|NIGHT|DAY|STARLINE))", parent_txt + " " + full_url.upper().replace("-", " ")):
                          if m not in chart_links:
                              chart_links[m] = full_url

          for tag in soup(["script", "style", "noscript"]):
              tag.decompose()

          full_page_text = " ".join(soup.get_text(" ", strip=True).split())

          def parse_live_slot(page_text, market_name):
              escaped = re.escape(market_name).replace(r"\ ", r"\s+")
              pattern = rf"(?<![A-Z0-9]){escaped}(?!\s*(?:MORNING|NIGHT|DAY|STARLINE|GOLD|BAZAR|JACKPOT))\s+Jodi\s+(.*?)\s+Panel"
              matches = list(re.finditer(pattern, page_text, re.IGNORECASE))
              return [m.group(1).strip() for m in matches]

          DIGIT_SLOT_RE = re.compile(r'([0-9\*]{3})\s*-\s*([0-9\*]{1,2})(?:\s*-\s*([0-9\*]{3}))?')

          def fetch_latest_from_chart_url(url):
              if not url:
                  return None
              try:
                  c_resp = scraper.get(url, timeout=15)
                  c_soup = BeautifulSoup(c_resp.text, "lxml")
                  c_text = " ".join(c_soup.get_text(" ", strip=True).split())
                  triples = re.findall(r'(?<![0-9])([0-9]{3})\s*[\-\s]\s*([0-9]{2})\s*[\-\s]\s*([0-9]{3})(?![0-9])', c_text)
                  if triples:
                      last = triples[-1]
                      return f"{last[0]}-{last[1]}-{last[2]}"
              except Exception:
                  pass
              return None

          MARKETS = ["MAIN BAZAR", "TIME BAZAR", "KALYAN", "RAJDHANI NIGHT"]
          key_map = {
              "MAIN BAZAR": "mainBazar",
              "TIME BAZAR": "timeBazar",
              "KALYAN": "kalyan",
              "RAJDHANI NIGHT": "rajdhani"
          }

          final_results = {}
          for m_name in MARKETS:
              slots = parse_live_slot(full_page_text, m_name)
              locked_val = None
              for s in slots:
                  dm = DIGIT_SLOT_RE.search(s)
                  if dm and not dm.group(1).startswith("*"):
                      op, jd, cl = dm.group(1), dm.group(2), dm.group(3) or "***"
                      locked_val = f"{op}-{jd}-{cl}"
                      break

              if not locked_val and chart_links.get(m_name):
                  chart_val = fetch_latest_from_chart_url(chart_links[m_name])
                  if chart_val:
                      locked_val = chart_val

              final_results[key_map[m_name]] = locked_val or "WAITING-LIVE"

          # Load Firebase State
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          try:
              req = urllib.request.urlopen(f"{FIREBASE_URL}/otc_pro_v62_master.json", context=ctx)
              state = json.loads(req.read().decode('utf-8')) or {}
          except Exception:
              state = {}

          state["feeders"] = final_results
          ist_now = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=5, minutes=30)
          state["updatedAt"] = ist_now.strftime("%Y-%m-%d %H:%M:%S IST")

          # 1. Save local fallback file live_feed.json
          with open("live_feed.json", "w", encoding="utf-8") as f:
              json.dump(state, f, indent=2)

          # 2. Update Firebase Nodes
          payload = json.dumps(state).encode('utf-8')
          for node in ["otc_pro_v62_master.json", "otc_pro_v61_real.json", "otc_pro_v51.json"]:
              put_req = urllib.request.Request(
                  f"{FIREBASE_URL}/{node}",
                  data=payload,
                  headers={'Content-Type': 'application/json'},
                  method='PUT'
              )
              urllib.request.urlopen(put_req, context=ctx)

          # 3. Telegram Alert
          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          if bot_token and chat_id:
              msg = (
                  f"⚡ *Smart OTC Pro Master Sync*\n"
                  f"🕒 Time: {state['updatedAt']}\n"
                  f"👑 Kalyan: `{final_results.get('kalyan')}`\n"
                  f"🌙 Rajdhani: `{final_results.get('rajdhani')}`\n"
                  f"⏱️ Time Bazar: `{final_results.get('timeBazar')}`\n"
                  f"🏛️ Main Bazar: `{final_results.get('mainBazar')}`"
              )
              tg_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
              tg_data = json.dumps({"chat_id": chat_id, "text": msg, "parse_mode": "Markdown"}).encode('utf-8')
              try:
                  urllib.request.urlopen(urllib.request.Request(tg_url, data=tg_data, headers={'Content-Type': 'application/json'}))
              except Exception:
                  pass

          print("Master Sync Complete successfully!")
          EOF

      - name: Commit & Push live_feed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_feed.json
          git diff --staged --quiet || git commit -m "Auto-sync live_feed.json [skip ci]"
          git push
